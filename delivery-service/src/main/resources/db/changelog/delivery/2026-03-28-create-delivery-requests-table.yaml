databaseChangeLog:
  - changeSet:
      id: 2026-03-28-create-delivery-requests-table
      author: Ali Ramazanov
      changes:
        - createTable:
            tableName: delivery_requests
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_delivery_requests
                    nullable: false
              - column:
                  name: booking_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: customer_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: destination_address
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: destination_city
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: destination_country
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: requested_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - sql:
            sql: |
              ALTER TABLE delivery_requests
                ADD CONSTRAINT chk_delivery_status
                CHECK (status IN ('PENDING', 'CONFIRMED', 'PICKING', 'DISPATCHED', 'IN_TRANSIT', 'DELIVERED', 'CANCELLED'));
        - createIndex:
            indexName: idx_delivery_requests_booking_id
            tableName: delivery_requests
            columns:
              - column:
                  name: booking_id
        - createIndex:
            indexName: idx_delivery_requests_customer_id
            tableName: delivery_requests
            columns:
              - column:
                  name: customer_id
