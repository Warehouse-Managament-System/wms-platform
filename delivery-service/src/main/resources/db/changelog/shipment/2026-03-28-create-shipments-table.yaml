databaseChangeLog:
  - changeSet:
      id: 2026-03-28-create-shipments-table
      author: Ali Ramazanov
      changes:
        - createTable:
            tableName: shipments
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_shipments
                    nullable: false
              - column:
                  name: delivery_request_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: claimed_by
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: claimed_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false
              - column:
                  name: scheduled_pickup_time
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false
              - column:
                  name: tracking_number
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: estimated_delivery_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: actual_delivery_date
                  type: DATE
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: notes
                  type: TEXT
                  defaultValue: ""
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            constraintName: fk_shipments_request_id
            baseTableName: shipments
            baseColumnNames: delivery_request_id
            referencedTableName: delivery_requests
            referencedColumnNames: id
        - addUniqueConstraint:
            constraintName: uq_shipments_tracking_number
            tableName: shipments
            columnNames: tracking_number
        - sql:
            sql: |
              ALTER TABLE shipments
                ADD CONSTRAINT chk_shipment_status
                CHECK (status IN ('AWAITING_PICKUP', 'PICKED_UP', 'ON_THE_WAY', 'COMPLETED'));
