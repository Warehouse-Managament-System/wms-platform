databaseChangeLog:
  - changeSet:
      id: 2026-03-28-create-shipment-checkpoints-table
      author: Ali Ramazanov
      changes:
        - createTable:
            tableName: shipment_checkpoints
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_shipment_checkpoints
                    nullable: false
              - column:
                  name: shipment_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: location
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: note
                  type: TEXT
                  defaultValue: ""
                  constraints:
                    nullable: false
              - column:
                  name: recorded_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            constraintName: fk_checkpoints_shipment_id
            baseTableName: shipment_checkpoints
            baseColumnNames: shipment_id
            referencedTableName: shipments
            referencedColumnNames: id
        - sql:
            sql: |
              ALTER TABLE shipment_checkpoints
                ADD CONSTRAINT chk_checkpoint_status
                CHECK (status IN ('AWAITING_PICKUP', 'PICKED_UP', 'ON_THE_WAY', 'COMPLETED'));
