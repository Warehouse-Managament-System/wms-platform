server:
  port: 8087

spring:
  datasource:
    url: jdbc:postgresql://localhost:5437/platform_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

wms:
  email:
    enabled: ${WMS_EMAIL_ENABLED:false}
