databaseChangeLog:
  - changeSet:
      id: 2026-03-26-create-payments-table
      author: Ali Ramazanov
      changes:
        - createTable:
            tableName: payments
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_payments
                    nullable: false
              - column:
                  name: invoice_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: stripe_payment_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: stripe_receipt_url
                  type: VARCHAR(500)
                  defaultValue: ""
                  constraints:
                    nullable: false
              - column:
                  name: amount
                  type: DECIMAL(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: failure_reason
                  type: VARCHAR(255)
                  defaultValue: ""
                  constraints:
                    nullable: false
              - column:
                  name: paid_at
                  type: TIMESTAMPTZ
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: payments
            baseColumnNames: invoice_id
            referencedTableName: invoices
            referencedColumnNames: id
            constraintName: fk_payments_invoice_id
        - addUniqueConstraint:
            tableName: payments
            columnNames: stripe_payment_id
            constraintName: uq_payments_stripe_payment_id
        - sql:
            sql: |
              ALTER TABLE payments
                ADD CONSTRAINT chk_payment_status
                CHECK (status IN ('PENDING', 'PROCESSING', 'SUCCEEDED', 'FAILED', 'REFUNDED'));
        - createIndex:
            indexName: idx_payments_invoice_id
            tableName: payments
            columns:
              - column:
                  name: invoice_id
