databaseChangeLog:
  - changeSet:
      id: 2026-03-26-create-invoices-table
      author: Ali Ramazanov
      changes:
        - createTable:
            tableName: invoices
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_invoices
                    nullable: false
              - column:
                  name: customer_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: warehouse_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: booking_id
                  type: UUID
              - column:
                  name: delivery_request_id
                  type: UUID
              - column:
                  name: invoice_type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: amount
                  type: DECIMAL(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: currency
                  type: VARCHAR(3)
                  defaultValue: USD
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: due_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: invoices
            baseColumnNames: booking_id
            referencedTableName: bookings
            referencedColumnNames: id
            constraintName: fk_invoices_booking_id
        - sql:
            sql: |
              ALTER TABLE invoices
                ADD CONSTRAINT chk_invoice_type
                CHECK (invoice_type IN ('BOOKING', 'DELIVERY', 'PENALTY'));

              ALTER TABLE invoices
                ADD CONSTRAINT chk_invoice_status
                CHECK (status IN ('DRAFT', 'ISSUED', 'PAID', 'OVERDUE', 'CANCELLED'));

              ALTER TABLE invoices
                ADD CONSTRAINT chk_invoice_amount CHECK (amount >= 0);
        - createIndex:
            indexName: idx_invoices_customer_id
            tableName: invoices
            columns:
              - column:
                  name: customer_id
        - createIndex:
            indexName: idx_invoices_warehouse_id
            tableName: invoices
            columns:
              - column:
                  name: warehouse_id
        - createIndex:
            indexName: idx_invoices_booking_id
            tableName: invoices
            columns:
              - column:
                  name: booking_id
