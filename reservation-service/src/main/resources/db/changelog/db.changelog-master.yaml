databaseChangeLog:
  - changeSet:
      id: 2026-03-01-create-schema
      author: Ali Ramazanov
      changes:
        - sql:
            sql: CREATE SCHEMA IF NOT EXISTS reservation_service

  - changeSet:
      id: 2026-03-01-create-outbox-events-table
      author: Ali Ramazanov
      changes:
        - createTable:
            tableName: outbox_events
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_outbox_events
                    nullable: false
              - column:
                  name: aggregate_type
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: aggregate_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: event_type
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: payload
                  type: JSONB
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: PENDING
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: published_at
                  type: TIMESTAMPTZ
        - sql:
            sql: |
              ALTER TABLE outbox_events
                ADD CONSTRAINT ck_outbox_events_status
                CHECK (status IN ('PENDING', 'SENT', 'FAILED'));

              CREATE INDEX idx_outbox_pending
                ON outbox_events(status) WHERE status = 'PENDING';
        - createIndex:
            indexName: idx_outbox_events_created_at
            tableName: outbox_events
            columns:
              - column:
                  name: created_at

  # Booking tables
  - include:
      file: db/changelog/booking/2026-03-26-create-bookings-table.yaml
  - include:
      file: db/changelog/booking/2026-03-26-create-booking-expiry-notifications-table.yaml

  # Billing tables
  - include:
      file: db/changelog/billing/2026-03-26-create-invoices-table.yaml
  - include:
      file: db/changelog/billing/2026-03-26-create-invoice-items-table.yaml
  - include:
      file: db/changelog/billing/2026-03-26-create-payments-table.yaml
