databaseChangeLog:
  - changeSet:
      id: 2026-03-26-create-bookings-table
      author: Ali Ramazanov
      changes:
        - createTable:
            tableName: bookings
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_bookings
                    nullable: false
              - column:
                  name: customer_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: warehouse_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: booking_type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: room_id
                  type: UUID
              - column:
                  name: zone_id
                  type: UUID
              - column:
                  name: start_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: end_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: surface_area
                  type: DECIMAL(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: total_price
                  type: DECIMAL(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: deleted_at
                  type: TIMESTAMPTZ
        - sql:
            sql: |
              ALTER TABLE bookings
                ADD CONSTRAINT chk_booking_dates CHECK (end_date > start_date);

              ALTER TABLE bookings
                ADD CONSTRAINT chk_booking_type
                CHECK (booking_type IN ('SHORT_TERM', 'LONG_TERM'));

              ALTER TABLE bookings
                ADD CONSTRAINT chk_booking_status
                CHECK (status IN ('PENDING', 'CONFIRMED', 'ACTIVE', 'EXPIRED', 'CANCELLED'));

              ALTER TABLE bookings
                ADD CONSTRAINT chk_booking_surface_area CHECK (surface_area > 0);

              ALTER TABLE bookings
                ADD CONSTRAINT chk_booking_total_price CHECK (total_price >= 0);
        - createIndex:
            indexName: idx_bookings_customer_id
            tableName: bookings
            columns:
              - column:
                  name: customer_id
        - createIndex:
            indexName: idx_bookings_warehouse_id
            tableName: bookings
            columns:
              - column:
                  name: warehouse_id
        - createIndex:
            indexName: idx_bookings_room_id
            tableName: bookings
            columns:
              - column:
                  name: room_id
        - createIndex:
            indexName: idx_bookings_zone_id
            tableName: bookings
            columns:
              - column:
                  name: zone_id
