services:

  # ── PostgreSQL Databases ──────────────────────────────────────────────

  identity-db:
    image: postgres:18
    container_name: identity-db
    environment:
      POSTGRES_DB: identity_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - identity-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d identity_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  inventory-db:
    image: postgres:18
    container_name: inventory-db
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - inventory-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inventory_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  reservation-db:
    image: postgres:18
    container_name: reservation-db
    environment:
      POSTGRES_DB: reservation_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - reservation-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reservation_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  delivery-db:
    image: postgres:18
    container_name: delivery-db
    environment:
      POSTGRES_DB: delivery_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5436:5432"
    volumes:
      - delivery-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d delivery_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  platform-db:
    image: postgres:18
    container_name: platform-db
    environment:
      POSTGRES_DB: platform_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5437:5432"
    volumes:
      - platform-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d platform_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Kafka (KRaft) ────────────────────────────────────────────────────

  kafka:
    image: apache/kafka:4.0.0
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: HOST://0.0.0.0:9092,DOCKER://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Debezium Connect ─────────────────────────────────────────────────

  debezium:
    image: debezium/connect:3.0.0.Final
    container_name: debezium
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: debezium-connect
      CONFIG_STORAGE_TOPIC: debezium_configs
      OFFSET_STORAGE_TOPIC: debezium_offsets
      STATUS_STORAGE_TOPIC: debezium_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    ports:
      - "8084:8083"
    depends_on:
      kafka:
        condition: service_healthy

  # ── Redis ─────────────────────────────────────────────────────────────

  redis:
    image: redis:8
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Observability ─────────────────────────────────────────────────────

  tempo:
    image: grafana/tempo:2.7.1
    container_name: tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"   # Tempo API
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP

  loki:
    image: grafana/loki:3.4.2
    container_name: loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki

  grafana:
    image: grafana/grafana:11.5.2
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: true
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - tempo
      - loki

  # ── Application services ─────────────────────────────────────────────
  #
  # These are NOT exposed to the host (no `ports:` mapping) — only the
  # API gateway is reachable from outside the docker network. This forces
  # all traffic through the gateway's JWT validation and prevents the
  # trusted-header spoofing attack where an attacker bypasses the gateway
  # by hitting a service directly with a forged X-User-Id header.

  eureka-server:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        SERVICE_MODULE: eureka-server
    container_name: eureka-server
    environment:
      SERVER_PORT: 8761

  api-gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        SERVICE_MODULE: api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_CONFIG_IMPORT: ""
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      JWT_SECRET: dev-only-secret-key-min-32-chars!!
    depends_on:
      eureka-server:
        condition: service_started

  identity-service:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        SERVICE_MODULE: identity-service
    container_name: identity-service
    environment:
      SERVER_PORT: 8081
      SPRING_CONFIG_IMPORT: ""
      SPRING_DATASOURCE_URL: jdbc:postgresql://identity-db:5432/identity_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      JWT_SECRET: dev-only-secret-key-min-32-chars!!
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://tempo:4317
    depends_on:
      identity-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_started

  inventory-service:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        SERVICE_MODULE: inventory-service
    container_name: inventory-service
    environment:
      SERVER_PORT: 8082
      SPRING_CONFIG_IMPORT: ""
      SPRING_DATASOURCE_URL: jdbc:postgresql://inventory-db:5432/inventory_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      JWT_SECRET: dev-only-secret-key-min-32-chars!!
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://tempo:4317
    depends_on:
      inventory-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_started

  reservation-service:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        SERVICE_MODULE: reservation-service
    container_name: reservation-service
    environment:
      SERVER_PORT: 8083
      SPRING_CONFIG_IMPORT: ""
      SPRING_DATASOURCE_URL: jdbc:postgresql://reservation-db:5432/reservation_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      JWT_SECRET: dev-only-secret-key-min-32-chars!!
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://tempo:4317
    depends_on:
      reservation-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      eureka-server:
        condition: service_started

  delivery-service:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        SERVICE_MODULE: delivery-service
    container_name: delivery-service
    environment:
      SERVER_PORT: 8085
      SPRING_CONFIG_IMPORT: ""
      SPRING_DATASOURCE_URL: jdbc:postgresql://delivery-db:5432/delivery_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      JWT_SECRET: dev-only-secret-key-min-32-chars!!
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://tempo:4317
    depends_on:
      delivery-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_started

  platform-service:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        SERVICE_MODULE: platform-service
    container_name: platform-service
    environment:
      SERVER_PORT: 8087
      SPRING_CONFIG_IMPORT: ""
      SPRING_DATASOURCE_URL: jdbc:postgresql://platform-db:5432/platform_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      JWT_SECRET: dev-only-secret-key-min-32-chars!!
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://tempo:4317
    depends_on:
      platform-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_started

volumes:
  identity-data:
  inventory-data:
  reservation-data:
  delivery-data:
  platform-data:
  kafka-data:
  redis-data:
  tempo-data:
  loki-data:
  grafana-data:
