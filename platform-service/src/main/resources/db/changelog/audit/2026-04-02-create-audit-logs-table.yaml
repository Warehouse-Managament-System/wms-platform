databaseChangeLog:
  - changeSet:
      id: 2026-04-02-create-audit-logs-table
      author: Ali Ramazanov
      changes:
        - createTable:
            tableName: audit_logs
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_audit_logs
                    nullable: false
              - column:
                  name: performed_by
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: action
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: entity_type
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: entity_id
                  type: UUID
              - column:
                  name: old_value
                  type: JSONB
              - column:
                  name: new_value
                  type: JSONB
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_audit_logs_entity
            tableName: audit_logs
            columns:
              - column:
                  name: entity_type
              - column:
                  name: entity_id
