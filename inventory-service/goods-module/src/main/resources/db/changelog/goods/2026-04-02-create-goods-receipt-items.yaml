databaseChangeLog:
  - changeSet:
      id: 2026-04-03-create-goods-receipt-items
      author: Gulay
      changes:
        - createTable:
            tableName: goods_receipt_items
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
              - column:
                  name: goods_receipt_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: goods_item_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: expected_qty
                  type: decimal(10,2)
              - column:
                  name: received_qty
                  type: decimal(10,2)
              - column:
                  name: condition
                  type: varchar(20)
              - column:
                  name: notes
                  type: varchar(255)
        - addForeignKeyConstraint:
            baseTableName: goods_receipt_items
            baseColumnNames: goods_receipt_id
            referencedTableName: goods_receipts
            referencedColumnNames: id
            constraintName: fk_goods_receipt_items_receipt
        - addForeignKeyConstraint:
            baseTableName: goods_receipt_items
            baseColumnNames: goods_item_id
            referencedTableName: goods_items
            referencedColumnNames: id
            constraintName: fk_goods_receipt_items_goods
