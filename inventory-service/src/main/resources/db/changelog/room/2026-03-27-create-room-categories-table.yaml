databaseChangeLog:
  - changeSet:
      id: 2026-03-27-create-room-categories-table
      author: Gulay
      changes:
        - createTable:
            tableName: room_categories
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_room_categories
                    nullable: false
              - column:
                  name: room_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: category_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            constraintName: fk_room_categories_rooms
            baseTableName: room_categories
            baseColumnNames: room_id
            referencedTableName: rooms
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            constraintName: fk_room_categories_categories
            baseTableName: room_categories
            baseColumnNames: category_id
            referencedTableName: categories
            referencedColumnNames: id
            onDelete: CASCADE
        - addUniqueConstraint:
            constraintName: uq_room_categories_room_category
            tableName: room_categories
            columnNames: room_id, category_id
