databaseChangeLog:
  - changeSet:
      id: 2026-03-27-add-room-check-constraints
      author: gulay
      changes:
        - sql:
            sql: |
              ALTER TABLE rooms
              ADD CONSTRAINT chk_price_per_sqm_daily CHECK (price_per_sqm_daily > 0);
        - sql:
            sql: |
              ALTER TABLE rooms
              ADD CONSTRAINT chk_price_per_sqm_weekly CHECK (price_per_sqm_weekly > 0);
        - sql:
            sql: |
              ALTER TABLE rooms
              ADD CONSTRAINT chk_price_per_sqm_monthly CHECK (price_per_sqm_monthly > 0);
        - sql:
            sql: |
              ALTER TABLE rooms
              ADD CONSTRAINT chk_status_values CHECK (status IN ('AVAILABLE','BOOKED','MAINTENANCE'));
