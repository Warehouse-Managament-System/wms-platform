databaseChangeLog:
  - changeSet:
      id: 2026-03-25-create-zone-availabilities-table
      author: Anar Arabli
      changes:
        - createTable:
            tableName: zone_availabilities
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_zone_availabilities
                    nullable: false
              - column:
                  name: zone_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: start_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: end_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            constraintName: fk_zone_availabilities_zones
            baseTableName: zone_availabilities
            baseColumnNames: zone_id
            referencedTableName: zones
            referencedColumnNames: id
            onDelete: CASCADE
        - sql:
            sql: |
              ALTER TABLE zone_availabilities
                ADD CONSTRAINT chk_zone_availability_dates
                CHECK (end_date > start_date);
