databaseChangeLog:
  - changeSet:
      id: 2026-03-09-create-warehouse-table
      author: Anar Arabli
      changes:
        - createTable:
            tableName: zone_availabilities
            columns:

              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: zone_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: start_date
                  type: DATE
                  constraints:
                    nullable: false

              - column:
                  name: end_date
                  type: DATE
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: zone_availabilities
            baseColumnNames: zone_id
            referencedTableName: zones
            referencedColumnNames: id
            constraintName: fk_zone_availability_zone
