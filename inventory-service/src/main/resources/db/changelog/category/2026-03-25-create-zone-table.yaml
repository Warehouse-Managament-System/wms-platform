databaseChangeLog:
  - changeSet:
      id: 2026-03-09-create-warehouse-table
      author: Anar Arabli
      changes:
        - createTable:
            tableName: zones
            columns:

              # BaseEntity fields
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              # Relation (ManyToOne -> Warehouse)
              - column:
                  name: warehouse_id
                  type: UUID
                  constraints:
                    nullable: false

              # Zone fields
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: temperature_type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: total_surface_area
                  type: DECIMAL(10,2)
                  constraints:
                    nullable: false

              - column:
                  name: discount_percentage
                  type: INTEGER
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

        # Foreign Key
        - addForeignKeyConstraint:
            baseTableName: zones
            baseColumnNames: warehouse_id
            referencedTableName: warehouses
            referencedColumnNames: id
            constraintName: fk_zones_warehouse
