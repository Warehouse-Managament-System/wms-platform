databaseChangeLog:
  - changeSet:
      id: 2026-03-09-create-warehouse-table
      author: Gulay
      changes:
        - createTable:
            tableName: warehouses
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_warehouses
                    nullable: false
              - column:
                  name: owner_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: address
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: city
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: country
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: latitude
                  type: DECIMAL(9,6)
                  constraints:
                    nullable: false
              - column:
                  name: longitude
                  type: DECIMAL(9,6)
                  constraints:
                    nullable: false
              - column:
                  name: total_surface_area
                  type: DECIMAL(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: discount_percentage
                  type: INT
                  defaultValueNumeric: "0"
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - sql:
            sql: |
              ALTER TABLE warehouses
                ADD CONSTRAINT ck_warehouses_latitude
                CHECK (latitude BETWEEN -90 AND 90);

              ALTER TABLE warehouses
                ADD CONSTRAINT ck_warehouses_longitude
                CHECK (longitude BETWEEN -180 AND 180);

              ALTER TABLE warehouses
                ADD CONSTRAINT ck_warehouses_total_surface_area
                CHECK (total_surface_area > 0);

              ALTER TABLE warehouses
                ADD CONSTRAINT ck_warehouses_discount_percentage
                CHECK (discount_percentage BETWEEN 0 AND 100);

              ALTER TABLE warehouses
                ADD CONSTRAINT ck_warehouses_status
                CHECK (status IN ('DRAFT','PUBLISHED','SUSPENDED','INACTIVE'));
