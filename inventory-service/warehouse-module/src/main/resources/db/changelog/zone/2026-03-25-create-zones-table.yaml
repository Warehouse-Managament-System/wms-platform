databaseChangeLog:
  - changeSet:
      id: 2026-03-25-create-zones-table
      author: Anar Arabli
      changes:
        - createTable:
            tableName: zones
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_zones
                    nullable: false
              - column:
                  name: warehouse_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: temperature_type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: total_surface_area
                  type: DECIMAL(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: discount_percentage
                  type: INT
                  defaultValueNumeric: "0"
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            constraintName: fk_zones_warehouses
            baseTableName: zones
            baseColumnNames: warehouse_id
            referencedTableName: warehouses
            referencedColumnNames: id
            onDelete: CASCADE
        - addUniqueConstraint:
            constraintName: uk_zones_warehouse_name
            tableName: zones
            columnNames: warehouse_id, name
        - sql:
            sql: |
              ALTER TABLE zones
                ADD CONSTRAINT ck_zones_temperature_type
                CHECK (temperature_type IN ('AMBIENT','REFRIGERATED','FROZEN'));

              ALTER TABLE zones
                ADD CONSTRAINT ck_zones_total_surface_area
                CHECK (total_surface_area > 0);

              ALTER TABLE zones
                ADD CONSTRAINT ck_zones_discount_percentage
                CHECK (discount_percentage BETWEEN 0 AND 100);

              ALTER TABLE zones
                ADD CONSTRAINT ck_zones_status
                CHECK (status IN ('ACTIVE','MAINTENANCE','INACTIVE'));
