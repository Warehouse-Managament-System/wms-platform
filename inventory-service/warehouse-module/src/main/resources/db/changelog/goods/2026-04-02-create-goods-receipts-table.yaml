databaseChangeLog:
  - changeSet:
      id: 2026-04-02-create-goods-receipts-table
      author: Ali Ramazanov
      changes:
        - createTable:
            tableName: goods_receipts
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_goods_receipts
                    nullable: false
              - column:
                  name: booking_id
                  type: UUID
              - column:
                  name: received_by
                  type: UUID
              - column:
                  name: inbound_carrier
                  type: VARCHAR(255)
              - column:
                  name: received_at
                  type: TIMESTAMPTZ
              - column:
                  name: notes
                  type: TEXT
