databaseChangeLog:
  - changeSet:
      id: 2026-04-02-create-goods-excel-imports-table
      author: Ali Ramazanov
      changes:
        - createTable:
            tableName: goods_excel_imports
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_goods_excel_imports
                    nullable: false
              - column:
                  name: booking_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: customer_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: warehouse_id
                  type: UUID
              - column:
                  name: file_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: total_rows
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: success_rows
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: failed_rows
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: error_file_url
                  type: VARCHAR(500)
                  defaultValue: ""
                  constraints:
                    nullable: false
              - column:
                  name: arrival_deadline
                  type: TIMESTAMPTZ
              - column:
                  name: approved_by
                  type: UUID
              - column:
                  name: approved_at
                  type: TIMESTAMPTZ
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
