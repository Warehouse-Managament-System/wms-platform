databaseChangeLog:
  - changeSet:
      id: 2026-04-02-create-goods-items-table
      author: Ali Ramazanov
      changes:
        - createTable:
            tableName: goods_items
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_goods_items
                    nullable: false
              - column:
                  name: goods_import_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: sku
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: barcode
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: DECIMAL(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
              - column:
                  name: deleted_at
                  type: TIMESTAMPTZ
        - addForeignKeyConstraint:
            constraintName: fk_goods_items_import
            baseTableName: goods_items
            baseColumnNames: goods_import_id
            referencedTableName: goods_excel_imports
            referencedColumnNames: id
