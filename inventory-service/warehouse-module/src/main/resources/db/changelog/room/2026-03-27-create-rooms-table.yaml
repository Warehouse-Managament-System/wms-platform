databaseChangeLog:
  - changeSet:
      id: 2026-03-27-create-rooms-table
      author: Gulay
      changes:
        - createTable:
            tableName: rooms
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_rooms
                    nullable: false
              - column:
                  name: zone_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: total_surface_area
                  type: DECIMAL(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: price_per_sqm_daily
                  type: DECIMAL(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: price_per_sqm_weekly
                  type: DECIMAL(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: price_per_sqm_monthly
                  type: DECIMAL(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: deleted_at
                  type: TIMESTAMPTZ
        - addForeignKeyConstraint:
            constraintName: fk_rooms_zones
            baseTableName: rooms
            baseColumnNames: zone_id
            referencedTableName: zones
            referencedColumnNames: id
            onDelete: CASCADE
        - addUniqueConstraint:
            constraintName: uq_rooms_zone_name
            tableName: rooms
            columnNames: zone_id, name
        - sql:
            sql: |
              ALTER TABLE rooms
                ADD CONSTRAINT chk_rooms_status
                CHECK (status IN ('AVAILABLE', 'BOOKED', 'MAINTENANCE'));

              ALTER TABLE rooms
                ADD CONSTRAINT chk_rooms_total_surface_area
                CHECK (total_surface_area > 0);

              ALTER TABLE rooms
                ADD CONSTRAINT chk_rooms_price_daily
                CHECK (price_per_sqm_daily > 0);

              ALTER TABLE rooms
                ADD CONSTRAINT chk_rooms_price_weekly
                CHECK (price_per_sqm_weekly > 0);

              ALTER TABLE rooms
                ADD CONSTRAINT chk_rooms_price_monthly
                CHECK (price_per_sqm_monthly > 0);
